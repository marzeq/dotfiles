autogenerated = 0
ecosystem {
  no_update_news = true
}

# ┌──────────┐
# │ MONITORS │
# └──────────┘

# CONFIGURED THROUGH NWG-DISPLAYS, DO NOT EDIT MANUALLY
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

# ┌──────────┐
# │ PROGRAMS │
# └──────────┘

$terminal = ghostty
$fileManager = nautilus --new-window
$rofi_common = -theme-str 'inputbar { children: [entry]; }'
$menu = rofi -modi drun -show drun -show-icons $rofi_common
$sshmenu = rofi -modi ssh -show ssh $rofi_common
$windowsmenu = rofi -modi window -show window -show-icons $rofi_common
$browser = firefox
env = EDITOR,nvim

# ┌───────────┐
# │ AUTOSTART │
# └───────────┘

exec-once = waybar
exec-once = hyprpaper
exec-once = wl-paste --primary --watch wl-copy
exec-once = swaync
exec-once = hypridle

exec-once = ~/.config/hypr/scripts/autostart.sh

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ┌──────────┐
# │ ENV VARS │
# └──────────┘


env = XDG_CURRENT_DESKTOP,Hyprland

env = HOST_LC_ALL,$LANG # fix for steam games using wrong locale

exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark" # for GTK4 apps

env = QT_QPA_PLATFORMTHEME,qt6ct # for Qt apps

# force toolkits to use wayland

env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct

# ┌─────────────┐
# │ CURSOR SIZE │
# └─────────────┘

$cursorSize = 24

env = XCURSOR_SIZE, $cursorSize
env = HYPRCURSOR_SIZE, $cursorSize

exec-once = hyprctl setcursor Adwaita $cursorSize


# ┌───────────────┐
# │ LOOK AND FEEL │
# └───────────────┘

$activeBorderColor = rgba(75A8E577)
$inactiveBorderColor = rgba(59595955)
$fontFamily = Cantarell

general { 
  gaps_in = 5
  gaps_out = 12

  border_size = 2

  col.active_border = $activeBorderColor
  col.inactive_border = $inactiveBorderColor

  resize_on_border = false 

  allow_tearing = false # allow_tearing = false -> vsync forced by compositor, allow_tearing = true -> vsync managed by windows

  layout = dwindle
}

decoration {
  rounding = 8
  rounding_power = 4

  dim_inactive = true
  dim_strength = 0.2

  shadow {
    enabled = false
  }

  blur {
    enabled = true
    size = 3
    passes = 1

    vibrancy = 0.1696
  }
}

animations {
  enabled = true

  bezier = curve, 0.05, 0.9, 0.1, 1.03
  $speed = 4

  animation = windows, 1, $speed, curve
  animation = workspaces, 1, $speed, default, slide
}

dwindle {
  preserve_split = true
}

misc { 
  force_default_wallpaper = 1
  disable_hyprland_logo = true
}

xwayland {
  force_zero_scaling = false
  use_nearest_neighbor = true
}


# ┌───────┐
# │ INPUT │
# └───────┘

input {
  kb_layout = pl
  kb_variant =
  kb_model =
  kb_options = fkeys:basic_13-24
  kb_rules =

  follow_mouse = 1

  sensitivity = -0.95

  scroll_factor = 1

  emulate_discrete_scroll = 1

  touchpad {
    natural_scroll = true
  }
}

device {
  name = huion-huion-tablet_hs64-stylus
  output = current
}

gestures {
  workspace_swipe = true
}

# ┌─────┐
# │ HDR │
# └─────┘

render {
  cm_enabled = true
  cm_fs_passthrough = 2
}

experimental {
  xx_color_management_v4 = true
}

env = DXVK_HDR,1
env = ENABLE_HDR_WSI,1

# ┌──────────────┐
# │ KEYBINDINGSS │
# └──────────────┘


$mod = SUPER

binde = $mod, Q, killactive,
bind = $mod, F, exec, $fileManager
bind = $mod, Return, exec, $terminal
bind = $mod, backslash, exec, $sshmenu
bind = $mod, B, exec, $browser
bind = $mod, T, togglefloating,
bind = $mod, Space, exec, $menu
bind = $mod, Tab, exec, $windowsmenu
bind = $mod, S, togglesplit,

bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r


bind = $mod SHIFT, F, fullscreen

bind = $mod SHIFT, Escape, exec, bash ~/.config/hypr/scripts/powermenu.sh

bind = $mod SHIFT, S, exec, bash ~/.config/hypr/scripts/screenshot.sh area
bind = $mod SHIFT, W, exec, bash ~/.config/hypr/scripts/screenshot.sh window
bind = $mod SHIFT, M, exec, bash ~/.config/hypr/scripts/screenshot.sh monitor

bind = $mod SHIFT, T, exec, ~/.config/hypr/scripts/hypr-ocr.sh
bind = $mod SHIFT, K, exec, ~/.wallpapers/switch

bind = $mod SHIFT, C, exec, hyprpicker -a

# mod + .
bind = $mod, Period, exec, smile


bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10

bindm = $mod, mouse:272, movewindow # mouse:272 = LMB
bindm = $mod, mouse:273, resizewindow # mouse:273 = RMB

binde=, XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/audio.sh inc_volume 2
binde=, XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/audio.sh dec_volume 2
bind =, XF86AudioMute, exec, ~/.config/hypr/scripts/audio.sh toggle_mute_volume
bind =, XF86AudioPlay, exec, ~/.config/hypr/scripts/audio.sh play_pause
bind =, XF86AudioPause, exec, ~/.config/hypr/scripts/audio.sh pause
bind =, Xf86AudioPlayPause, exec, ~/.config/hypr/scripts/audio.sh play_pause
bind =, XF86AudioNext, exec, ~/.config/hypr/scripts/audio.sh next
bind =, XF86AudioPrev, exec, ~/.config/hypr/scripts/audio.sh previous

# ┌──────────────────────────┐
# │ WINDOW & WORKSPACE RULES │
# └──────────────────────────┘


windowrule = suppressevent maximize, class:.*

windowrule = float, class:org.gnome.Calculator

windowrule = float, class:blueberry.py

windowrule = float, class:org.pulseaudio.pavucontrol
windowrule = size 762 666, class:org.pulseaudio.pavucontrol

windowrule = float, class:.*zenity.*

windowrule = float, class:it.mijorus.smile
windowrule = size 600 800, class:it.mijorus.smile

windowrule = idleinhibit fullscreen, class:.*
windowrule = nodim, fullscreenstate:* 2
windowrule = nodim, title:Picture-in-Picture
windowrule = nodim, class:.*gimp.*

layerrule = noanim, ^(rofi)$
layerrule = blur, ^(waybar)$
