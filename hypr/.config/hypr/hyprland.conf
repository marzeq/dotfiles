autogenerated = 0 

################
### MONITORS ###
################

# https://wiki.hyprland.org/Configuring/Monitors/
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

################
### PROGRAMS ###
################

$terminal = alacritty
$fileManager = nautilus
$menu = rofi -show drun
$browser = firefox


#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = hyprpaper
exec-once = clipse -listen
exec-once = swaync
exec-once = hypridle

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1


#############################
### ENVIRONMENT VARIABLES ###
#############################

# https://wiki.hyprland.org/Configuring/Environment-variables/

env = XDG_CURRENT_DESKTOP,Hyprland

exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps
exec = xdg-mime default org.gnome.nautilus.desktop inode/directory application/x-directory # force nautilus as default file manager
env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps

# force toolkits to use wayland

env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct

env = bitdepth,10 # apparently needed for screen sharing, weird but okay

###################
### CURSOR SIZE ###
###################

$cursorSize = 24

env = XCURSOR_SIZE, $cursorSize
env = HYPRCURSOR_SIZE, $cursorSize

exec-once=hyprctl setcursor Adwaita $cursorSize


#####################
### LOOK AND FEEL ###
#####################

general { 
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    col.active_border = rgba(61afefaa)
    col.inactive_border = rgba(595959aa)

    resize_on_border = false 

    allow_tearing = false # allow_tearing = false -> vsync forced by compositor, allow_tearing = true -> vsync managed by windows

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 1.0

    drop_shadow = true
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1
        
        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# https://wiki.hyprland.org/Configuring/Dwindle-Layout/
dwindle {
    preserve_split = true
}


# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = 1
    disable_hyprland_logo = true
}

xwayland {
    force_zero_scaling = false
    use_nearest_neighbor = true
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options = fkeys:basic_13-24
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.95 # -1.0 - 1.0, 0 means no modification.

    scroll_factor = 1

    emulate_discrete_scroll = 1

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = false
}


####################
### KEYBINDINGSS ###
####################

# https://wiki.hyprland.org/Configuring/Binds/

$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, B, exec, $browser
bind = $mod, Q, killactive,
# bind = $mod, M, exit, # unused, disabled to not press by accident and replaced by the powermenu
bind = $mod, F, exec, $fileManager
bind = $mod, T, togglefloating,
bind = $mod, Space, exec, $menu
bind = $mod, S, togglesplit,

bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

bind = $mod_SHIFT, H, movewindow, l
bind = $mod_SHIFT, J, movewindow, d
bind = $mod_SHIFT, K, movewindow, u
bind = $mod_SHIFT, L, movewindow, r
bind = $mod_SHIFT, left, movewindow, l
bind = $mod_SHIFT, down, movewindow, d
bind = $mod_SHIFT, up, movewindow, u
bind = $mod_SHIFT, right, movewindow, r


bind = $mod_SHIFT, F, fullscreen

bind = $mod, Escape, exec, bash ~/.config/hypr/scripts/powermenu.sh
bind = $mod, V, exec, bash ~/.config/hypr/scripts/volumemenu.sh

bind = $mod_SHIFT, S, exec, bash ~/.config/hypr/scripts/screenshot-menu.sh
bind = $mod_SHIFT, C, exec, hyprpicker -a


bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod_SHIFT, 1, movetoworkspace, 1
bind = $mod_SHIFT, 2, movetoworkspace, 2
bind = $mod_SHIFT, 3, movetoworkspace, 3
bind = $mod_SHIFT, 4, movetoworkspace, 4
bind = $mod_SHIFT, 5, movetoworkspace, 5
bind = $mod_SHIFT, 6, movetoworkspace, 6
bind = $mod_SHIFT, 7, movetoworkspace, 7
bind = $mod_SHIFT, 8, movetoworkspace, 8
bind = $mod_SHIFT, 9, movetoworkspace, 9
bind = $mod_SHIFT, 0, movetoworkspace, 10

bindm = $mod, mouse:272, movewindow # mouse:272 = LMB
bindm = $mod, mouse:273, resizewindow # mouse:273 = RMB


##############################
### WINDOWS AND WORKSPACES ###
##############################

# https://wiki.hyprland.org/Configuring/Window-Rules/ for window rules
# https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

windowrulev2 = suppressevent maximize, class:.* # disables maximise event for all windows

windowrulev2 = float, class:org.gnome.Calculator # floating mode by default for gnome calculator
windowrulev2 = float, class:blueberry.py
windowrulev2 = float, class:org.pulseaudio.pavucontrol
windowrulev2 = size 612 666, class:org.pulseaudio.pavucontrol
