autogenerated = 0 

################
### MONITORS ###
################

# https://wiki.hyprland.org/Configuring/Monitors/
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

################
### PROGRAMS ###
################

$terminal = alacritty
$fileManager = nautilus
$menu = rofi -show drun -show-icons
$browser = firefox


#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = hyprpaper
exec-once = clipse -listen
exec-once = swaync
exec-once = hypridle

exec-once = ~/.config/hypr/autostart.sh

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1


#############################
### ENVIRONMENT VARIABLES ###
#############################

# https://wiki.hyprland.org/Configuring/Environment-variables/

env = XDG_CURRENT_DESKTOP,Hyprland

exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"                   # for GTK4 apps

exec = xdg-mime default org.gnome.Nautilus.desktop inode/directory application/x-directory    # force nautilus as default file manager
exec = xdg-mime default org.gnome.eog.desktop image/png image/jpg image/webp                  # force eog as default image viewer
env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps

# force toolkits to use wayland

env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct

env = bitdepth,10 # apparently needed for screen sharing, weird but okay

###################
### CURSOR SIZE ###
###################

$cursorSize = 24

env = XCURSOR_SIZE, $cursorSize
env = HYPRCURSOR_SIZE, $cursorSize

exec-once=hyprctl setcursor Adwaita $cursorSize


#####################
### LOOK AND FEEL ###
#####################

general { 
  gaps_in = 5
  gaps_out = 12

  border_size = 2

  col.active_border = rgba(61afef77)
  col.inactive_border = rgba(59595955)

  resize_on_border = false 

  allow_tearing = false # allow_tearing = false -> vsync forced by compositor, allow_tearing = true -> vsync managed by windows

  layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
  rounding = 10

  dim_inactive = true
  dim_strength = 0.2

  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }

  # https://wiki.hyprland.org/Configuring/Variables/#blur
  blur {
    enabled = true
    size = 3
    passes = 1

    vibrancy = 0.1696
  }
}

# https://wiki.hyprland.org/Configuring/Animations/
animations {
  enabled = true

  bezier = curve, 0.05, 0.9, 0.1, 1
  $speed = 4

  animation = windows, 1, $speed, curve
  animation = windowsOut, 1, $speed, default, popin 80%
  animation = fade, 1, $speed, default
  animation = workspaces, 1, $speed, default
}

# https://wiki.hyprland.org/Configuring/Dwindle-Layout/
dwindle {
  preserve_split = true
}


# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
  force_default_wallpaper = 1
  disable_hyprland_logo = true
}

xwayland {
  force_zero_scaling = false
  use_nearest_neighbor = true
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
  kb_layout = pl
  kb_variant =
  kb_model =
  kb_options = fkeys:basic_13-24
  kb_rules =

  follow_mouse = 1

  sensitivity = -0.95 # -1.0 - 1.0, 0 means no modification.

  scroll_factor = 1

  emulate_discrete_scroll = 1

  touchpad {
    natural_scroll = false
  }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
  workspace_swipe = false
}


####################
### KEYBINDINGSS ###
####################

# https://wiki.hyprland.org/Configuring/Binds/

$mod = SUPER

binde = $mod, Q, killactive,
# bind = $mod_SHIFT, E, exit, # unused, disabled to not press by accident and replaced by the powermenu
bind = $mod, F, exec, $fileManager
bind = $mod, Return, exec, $terminal
bind = $mod, B, exec, $browser
bind = $mod, T, togglefloating,
bind = $mod, Space, exec, $menu
bind = $mod, S, togglesplit,

bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

bind = $mod_SHIFT, H, movewindow, l
bind = $mod_SHIFT, J, movewindow, d
bind = $mod_SHIFT, K, movewindow, u
bind = $mod_SHIFT, L, movewindow, r
bind = $mod_SHIFT, left, movewindow, l
bind = $mod_SHIFT, down, movewindow, d
bind = $mod_SHIFT, up, movewindow, u
bind = $mod_SHIFT, right, movewindow, r


bind = $mod_SHIFT, F, fullscreen

bind = $mod_SHIFT, Escape, exec, bash ~/.config/hypr/scripts/powermenu.sh
bind = $mod_SHIFT, V, exec, bash ~/.config/hypr/scripts/volumemenu.sh

bind = $mod_SHIFT, S, exec, bash ~/.config/hypr/scripts/screenshot.sh area
bind = $mod_SHIFT, W, exec, bash ~/.config/hypr/scripts/screenshot.sh window
bind = $mod_SHIFT, M, exec, bash ~/.config/hypr/scripts/screenshot.sh monitor

bind = $mod_SHIFT, T, exec, ~/.config/hypr/scripts/hypr-ocr

bind = $mod_SHIFT, C, exec, hyprpicker -a


bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod_SHIFT, 1, movetoworkspacesilent, 1
bind = $mod_SHIFT, 2, movetoworkspacesilent, 2
bind = $mod_SHIFT, 3, movetoworkspacesilent, 3
bind = $mod_SHIFT, 4, movetoworkspacesilent, 4
bind = $mod_SHIFT, 5, movetoworkspacesilent, 5
bind = $mod_SHIFT, 6, movetoworkspacesilent, 6
bind = $mod_SHIFT, 7, movetoworkspacesilent, 7
bind = $mod_SHIFT, 8, movetoworkspacesilent, 8
bind = $mod_SHIFT, 9, movetoworkspacesilent, 9
bind = $mod_SHIFT, 0, movetoworkspacesilent, 10

bindm = $mod, mouse:272, movewindow # mouse:272 = LMB
bindm = $mod, mouse:273, resizewindow # mouse:273 = RMB

binde=, XF86AudioRaiseVolume, exec, pactl set-sink-volume u/DEFAULT_SINK@ +5%
binde=, XF86AudioLowerVolume, exec, pactl set-sink-volume u/DEFAULT_SINK@ -5%
bind=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=, XF86AudioPlay, exec, playerctl play-pause
bind=, XF86AudioNext, exec, playerctl next 
bind=, XF86AudioPrev, exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

# https://wiki.hyprland.org/Configuring/Window-Rules/ for window rules
# https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

windowrulev2 = suppressevent maximize, class:.* # disables maximise event for all windows

windowrulev2 = float, class:org.gnome.Calculator # floating mode by default for gnome calculator
windowrulev2 = float, class:blueberry.py
windowrulev2 = float, class:org.pulseaudio.pavucontrol
windowrulev2 = size 612 666, class:org.pulseaudio.pavucontrol

windowrulev2 = idleinhibit fullscreen, class:.* # dont allow idle on fullscreen windows
windowrulev2 = nodim, fullscreenstate:* 2 # dont dim windows that are fullscreen
windowrulev2 = idleinhibit always, class:$(firefox) # dont allow idle on firefox

layerrule = noanim, ^(rofi)$ # disable animations for rofi
