# Keep mpv running after playback finishes instead of exiting.
idle=yes

# Keep the last video frame visible when a file reaches the end.
keep-open=yes

# Keep a window visible while idle.
force-window=yes


# Prefer english subs and dubs
slang=en-GB,enGB,en,eng,en-US,enUS
alang=en-GB,enGB,en,eng,en-US,enUS

sub-font-size=36
sub-color="#FFEBD834"
sub-border-style=background-box
sub-border-color="#FF262626"
# Slightly soften subtitle edges.
sub-blur=5
# Thickness of the subtitle background box.
sub-border-size=3
# Small subtitle shadow offset.
sub-shadow-offset=1
sub-shadow-color="#33000000"
# Slightly increase spacing between characters.
sub-spacing=0.5

# Improve subtitle compositing and anti-aliasing quality.
blend-subtitles

# Disable VSFilter-compatible ASS blur scaling.
# Equivalent to the removed sub-ass-vsfilter-blur-compat=no option.
sub-ass-use-video-data=aspect-ratio


# Remember playback position when quitting a file.
save-position-on-quit

# Keep a watch history of played files.
save-watch-history

osd-status-msg=${playback-time/full} / ${duration} (${percent-pos}%)\nframe: ${estimated-frame-number} / ${estimated-frame-count}
